
name: Sync Next.js

on:
  schedule:
    - cron: "0 10 * * 0"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-nextjs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Generate latest Next.js
        shell: bash
        run: |
          set -euo pipefail

          # Generate the latest official Next.js project
          tmp_dir="$(mktemp -d)"
          cd "$tmp_dir"
          pnpm create next-app@latest next-template \
            --biome \

          # Sync the generated project into the repository root
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            "$tmp_dir/next-template/" "$GITHUB_WORKSPACE/"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/sync-nextjs
          delete-branch: true
          commit-message: "chore: sync create-next-app@latest --biome"
          title: "chore: sync create-next-app@latest --biome"
          body: |
            ## Sync Next.js

            自动同步最新官方 Next.js 脚手架。

            执行命令：

            ```bash
            pnpm create next-app@latest --biome
            ```

            同步范围：
            - 完整项目文件
            - package.json
            - pnpm-lock.yaml
            - 官方配置文件
            - 示例页面及资源

            保留：
            - .github/workflows/

            请检查依赖变化、构建结果和配置变更后再合并。
